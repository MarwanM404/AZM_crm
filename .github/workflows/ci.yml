name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # PostgreSQL, not SQLite: the take-race test needs row-level locking, which SQLite does
    # not have. Without this service it is skipped here as well and the guarantee is never
    # actually exercised anywhere.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: azm_crm
          POSTGRES_USER: azm_crm
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      # Redis is required for live chat, not merely useful: it carries the channel layer,
      # presence and the queue. The test settings use an in-memory layer, so this exists for
      # the integration paths that touch Redis directly.
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_NAME: azm_crm
      DATABASE_USER: azm_crm
      DATABASE_PASSWORD: ci-password
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements/local.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy .
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
      - name: Install browsers for the right-to-left checks
        run: python -m playwright install --with-deps chromium
      # Two sessions on purpose: pytest-playwright owns an event loop and pytest-asyncio
      # manages its own, so the browser tests and the WebSocket consumer tests cannot share
      # a session. Splitting them is the fix, not a workaround.
      - name: Test
        run: pytest -m "not e2e" --cov
        # Without this the step falls back to the pyproject default (config.settings.test,
        # SQLite), so the take-race test skips here exactly as it does locally and the
        # PostgreSQL service above sits unused — the guarantee this job exists to check is
        # never actually checked. pytest-django resolves the env var ahead of the ini value.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
      - name: Browser tests
        run: pytest -m e2e
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r requirements/base.txt
