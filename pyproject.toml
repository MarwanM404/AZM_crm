[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "DJ"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

# Logical-properties-only CSS is enforced by tests/test_i18n_completeness.py,
# not by ruff (ruff lints Python, not CSS).

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations/", ".venv/"]

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
# Consumer tests are async; "auto" saves a decorator on every one of them.
asyncio_mode = "auto"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = "-ra"
markers = [
    # The browser tests MUST run in their own pytest session. pytest-playwright drives the
    # browser from a greenlet that owns an event loop, and pytest-asyncio manages its own for
    # the WebSocket consumer tests; in one session they collide with "This event loop is
    # already running". Two sessions, not one:
    #     pytest -m "not e2e"   &&   pytest -m e2e
    "e2e: browser-based checks; run in their own session (see note above)",
    "slow: volume checks that build thousands of rows (run: -m 'not slow' to skip)",
]

[tool.coverage.run]
source = ["apps", "config"]
# Test files are 100% covered by definition — including them inflates the figure and hides
# thin coverage of the code that actually ships.
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
    "config/asgi.py",
    "config/wsgi.py",
    # Settings modules are configuration, not logic: the test run imports exactly one of
    # them, so measuring the others reports 0% for files that cannot be exercised here.
    "config/settings/local.py",
    "config/settings/production.py",
]

[tool.coverage.report]
# Set below the measured 95% on purpose: a gate at the current figure fails the next honest
# commit and gets lowered in a hurry, which is how a coverage gate stops meaning anything.
# 90% leaves room for ordinary work while still catching a phase that shipped untested.
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
